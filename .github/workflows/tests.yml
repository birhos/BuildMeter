name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  wrapper:
    strategy:
      matrix:
        os: [macos-15, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: wrapper
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: wrapper/go.mod
          cache-dependency-path: wrapper/go.sum

      - name: Fixture, profil ve çözümleme testleri
        run: |
          go vet ./...
          go test ./...

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Çözümleme ve sinyal testleri
        run: npm test

  macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v5

      - name: XcodeGen kur
        run: brew install xcodegen

      - name: Fixture testleri
        run: |
          xcodegen generate --quiet
          xcodebuild -project BuildMeter.xcodeproj -scheme BuildMeter \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Fixture testleri ve tepsi uygulaması
        run: dotnet test BuildMeter.Windows.sln
