name: Release wrapper

# Bir GitHub release yayınlandığında terminal wrapper'ını macOS (universal), Windows
# ve Linux için derler; shim'ler, MSBuild hook'u ve checksums.txt ile birlikte release'e
# yükler. scripts/install-cli.sh ve scripts/install.ps1 bu dosyaları indirir.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Sürüm etiketi (ör. v1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: wrapper/go.mod
          cache-dependency-path: wrapper/go.sum

      - name: Test
        working-directory: wrapper
        run: go test ./...

      - name: Derle
        working-directory: wrapper
        run: |
          mkdir -p ../dist
          flags="-s -w -X main.version=${TAG}"
          build() { GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build -trimpath -ldflags "$flags" -o "../dist/$3" .; }
          build darwin amd64 buildmeter-darwin-amd64
          build darwin arm64 buildmeter-darwin-arm64
          lipo -create -output ../dist/buildmeter-darwin-universal \
            ../dist/buildmeter-darwin-amd64 ../dist/buildmeter-darwin-arm64
          rm ../dist/buildmeter-darwin-amd64 ../dist/buildmeter-darwin-arm64
          build windows amd64 buildmeter-windows-amd64.exe
          build windows arm64 buildmeter-windows-arm64.exe
          build linux amd64 buildmeter-linux-amd64
          build linux arm64 buildmeter-linux-arm64

      - name: Shim'ler, hook ve checksum'lar
        run: |
          cp cli/buildmeter.sh cli/buildmeter.ps1 cli/msbuild/BuildMeter.targets dist/
          cd dist && shasum -a 256 * > checksums.txt && cat checksums.txt

      - name: Release'e yükle
        run: gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
